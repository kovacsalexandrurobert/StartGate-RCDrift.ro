name: Firmware protocol tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q firmware
      - run: python -m unittest discover -s tests -v
      - name: Read-only public staging TLS
        run: python tests/staging_tls_smoke.py
