<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 640" font-family="sans-serif" font-size="12">
  <rect width="700" height="640" fill="#f8f9fa"/>
  <text x="350" y="25" text-anchor="middle" font-weight="bold" font-size="16">Start Light - Single Set + Status Display</text>
  
  <!-- Pico W outline -->
  <rect x="50" y="50" width="160" height="215" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="5"/>
  <text x="130" y="75" text-anchor="middle" font-weight="bold">Raspberry Pi Pico W</text>
  
  <!-- GPIO pins -->
  <text x="70" y="105">GP2 Red</text>
  <rect x="150" y="93" width="50" height="18" fill="#fff" stroke="#666"/>
  <text x="70" y="130">GP3 Yellow1</text>
  <rect x="150" y="118" width="50" height="18" fill="#fff" stroke="#666"/>
  <text x="70" y="155">GP4 Yellow2</text>
  <rect x="150" y="143" width="50" height="18" fill="#fff" stroke="#666"/>
  <text x="70" y="180">GP5 Green</text>
  <rect x="150" y="168" width="50" height="18" fill="#fff" stroke="#666"/>
  <text x="70" y="215">GP6 SDA</text>
  <rect x="150" y="203" width="50" height="18" fill="#e3f2fd" stroke="#666"/>
  <text x="70" y="250">GP7 SCL</text>
  <rect x="150" y="238" width="50" height="18" fill="#e3f2fd" stroke="#666"/>
  <text x="70" y="285">3V3</text>
  <rect x="150" y="273" width="50" height="18" fill="#ffcccc" stroke="#666"/>
  <text x="70" y="307">GND</text>
  <rect x="150" y="295" width="50" height="18" fill="#ccc" stroke="#666"/>
  
  <!-- Resistors -->
  <rect x="250" y="100" width="40" height="8" fill="#fff" stroke="#333"/>
  <text x="270" y="107" text-anchor="middle" font-size="10">220R</text>
  <rect x="250" y="125" width="40" height="8" fill="#fff" stroke="#333"/>
  <text x="270" y="132" text-anchor="middle" font-size="10">220R</text>
  <rect x="250" y="150" width="40" height="8" fill="#fff" stroke="#333"/>
  <text x="270" y="157" text-anchor="middle" font-size="10">220R</text>
  <rect x="250" y="175" width="40" height="8" fill="#fff" stroke="#333"/>
  <text x="270" y="182" text-anchor="middle" font-size="10">220R</text>
  
  <!-- SSR blocks -->
  <rect x="340" y="92" width="70" height="28" fill="#e0e0e0" stroke="#333"/>
  <text x="375" y="110" text-anchor="middle">SSR 1</text>
  <rect x="340" y="117" width="70" height="28" fill="#e0e0e0" stroke="#333"/>
  <text x="375" y="135" text-anchor="middle">SSR 2</text>
  <rect x="340" y="142" width="70" height="28" fill="#e0e0e0" stroke="#333"/>
  <text x="375" y="160" text-anchor="middle">SSR 3</text>
  <rect x="340" y="167" width="70" height="28" fill="#e0e0e0" stroke="#333"/>
  <text x="375" y="185" text-anchor="middle">SSR 4</text>
  
  <!-- Connection lines -->
  <line x1="200" y1="102" x2="248" y2="104" stroke="#333" stroke-width="1"/>
  <line x1="292" y1="104" x2="338" y2="106" stroke="#333" stroke-width="1"/>
  <line x1="200" y1="127" x2="248" y2="129" stroke="#333" stroke-width="1"/>
  <line x1="292" y1="129" x2="338" y2="131" stroke="#333" stroke-width="1"/>
  <line x1="200" y1="152" x2="248" y2="154" stroke="#333" stroke-width="1"/>
  <line x1="292" y1="154" x2="338" y2="156" stroke="#333" stroke-width="1"/>
  <line x1="200" y1="177" x2="248" y2="179" stroke="#333" stroke-width="1"/>
  <line x1="292" y1="179" x2="338" y2="181" stroke="#333" stroke-width="1"/>
  
  <!-- LED outputs -->
  <rect x="450" y="92" width="55" height="28" fill="#ffcccc" stroke="#333"/>
  <text x="477" y="110" text-anchor="middle">Red</text>
  <rect x="450" y="117" width="55" height="28" fill="#ffffcc" stroke="#333"/>
  <text x="477" y="135" text-anchor="middle">Yel1</text>
  <rect x="450" y="142" width="55" height="28" fill="#ffffcc" stroke="#333"/>
  <text x="477" y="160" text-anchor="middle">Yel2</text>
  <rect x="450" y="167" width="55" height="28" fill="#ccffcc" stroke="#333"/>
  <text x="477" y="185" text-anchor="middle">Green</text>
  
  <line x1="410" y1="106" x2="448" y2="106" stroke="#333" stroke-width="1"/>
  <line x1="410" y1="131" x2="448" y2="131" stroke="#333" stroke-width="1"/>
  <line x1="410" y1="156" x2="448" y2="156" stroke="#333" stroke-width="1"/>
  <line x1="410" y1="181" x2="448" y2="181" stroke="#333" stroke-width="1"/>
  
  <!-- Power: 5V for Pico W -->
  <rect x="50" y="355" width="120" height="90" fill="#e8f5e9" stroke="#333"/>
  <text x="110" y="380" text-anchor="middle" font-weight="bold">Pico W Power</text>
  <text x="110" y="400" text-anchor="middle">5V DC (USB or</text>
  <text x="110" y="415" text-anchor="middle">adapter)</text>
  <rect x="70" y="425" width="40" height="12" fill="#fff" stroke="#666"/>
  <text x="90" y="434" text-anchor="middle" font-size="10">+5V</text>
  <rect x="120" y="425" width="40" height="12" fill="#ccc" stroke="#666"/>
  <text x="140" y="434" text-anchor="middle" font-size="10">GND</text>
  <line x1="90" y1="445" x2="90" y2="460" stroke="#333" stroke-width="1"/>
  <line x1="140" y1="445" x2="140" y2="460" stroke="#333" stroke-width="1"/>
  <text x="90" y="473" text-anchor="middle" font-size="9">VBUS</text>
  <text x="140" y="473" text-anchor="middle" font-size="9">GND</text>
  
  <!-- Power: 5-12V for LEDs -->
  <rect x="200" y="355" width="120" height="90" fill="#fff3e0" stroke="#333"/>
  <text x="260" y="380" text-anchor="middle" font-weight="bold">LED Power</text>
  <text x="260" y="400" text-anchor="middle">5-12V DC</text>
  <rect x="220" y="425" width="40" height="12" fill="#fff" stroke="#666"/>
  <text x="240" y="434" text-anchor="middle" font-size="10">+V</text>
  <rect x="270" y="425" width="40" height="12" fill="#ccc" stroke="#666"/>
  <text x="290" y="434" text-anchor="middle" font-size="10">GND</text>
  <line x1="240" y1="445" x2="240" y2="460" stroke="#333" stroke-width="1"/>
  <line x1="290" y1="445" x2="290" y2="460" stroke="#333" stroke-width="1"/>
  <text x="240" y="473" text-anchor="middle" font-size="9">to LEDs</text>
  <text x="290" y="473" text-anchor="middle" font-size="9">GND</text>
  
  <!-- 5V to Pico (VBUS pin 40) -->
  <line x1="90" y1="445" x2="210" y2="85" stroke="#e65100" stroke-width="2"/>
  <text x="155" y="270" font-size="9" fill="#e65100">5V to VBUS (pin 40)</text>
  <circle cx="210" cy="85" r="4" fill="#e65100"/>
  <text x="218" y="82" font-size="9">VBUS</text>
  
  <!-- Common GND rail -->
  <rect x="50" y="500" width="610" height="125" fill="#eceff1" stroke="#333" rx="3"/>
  <text x="355" y="525" text-anchor="middle" font-weight="bold">Common GND - Connect all grounds together</text>
  <line x1="175" y1="550" x2="355" y2="550" stroke="#333" stroke-width="2"/>
  <line x1="355" y1="550" x2="590" y2="550" stroke="#333" stroke-width="2"/>
  <!-- Pico GND to common -->
  <line x1="175" y1="312" x2="175" y2="500" stroke="#333" stroke-width="1" stroke-dasharray="4,2"/>
  <circle cx="175" cy="312" r="3" fill="#333"/>
  <text x="175" y="585" text-anchor="middle" font-size="10">Pico GND (pin 38)</text>
  <!-- LED supply GND to common -->
  <line x1="290" y1="460" x2="290" y2="500" stroke="#333" stroke-width="1" stroke-dasharray="4,2"/>
  <circle cx="290" cy="460" r="3" fill="#333"/>
  <text x="290" y="585" text-anchor="middle" font-size="10">LED supply GND</text>
  <!-- 5V block GND to common -->
  <line x1="140" y1="445" x2="140" y2="500" stroke="#333" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="140" y="585" text-anchor="middle" font-size="10">5V supply GND</text>
  <!-- Display GND to common -->
  <line x1="610" y1="197" x2="610" y2="550" stroke="#333" stroke-width="1" stroke-dasharray="4,2"/>
  <circle cx="610" cy="550" r="3" fill="#333"/>
  <text x="610" y="585" text-anchor="middle" font-size="10">Display GND</text>
  
  <!-- Mini Display (I2C OLED SSD1306 128x64) -->
  <rect x="520" y="50" width="140" height="120" fill="#1a1a2e" stroke="#333" stroke-width="2" rx="4"/>
  <rect x="530" y="65" width="120" height="64" fill="#0f3460" stroke="#4a5568"/>
  <text x="590" y="145" text-anchor="middle" font-weight="bold" fill="#fff">OLED Display</text>
  <text x="590" y="160" text-anchor="middle" font-size="10" fill="#ddd">128x64 I2C (SSD1306)</text>
  <!-- Display pin labels -->
  <text x="535" y="185">VCC</text>
  <rect x="595" y="173" width="30" height="14" fill="#2d3748" stroke="#4a5568"/>
  <text x="535" y="202">GND</text>
  <rect x="595" y="190" width="30" height="14" fill="#2d3748" stroke="#4a5568"/>
  <text x="535" y="219">SDA</text>
  <rect x="595" y="207" width="30" height="14" fill="#2d3748" stroke="#4a5568"/>
  <text x="535" y="236">SCL</text>
  <rect x="595" y="224" width="30" height="14" fill="#2d3748" stroke="#4a5568"/>
  
  <!-- I2C connections Pico to Display -->
  <line x1="200" y1="210" x2="520" y2="210" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="360" y="200" font-size="9" fill="#2563eb">GP6 SDA (I2C1)</text>
  <line x1="200" y1="245" x2="520" y2="245" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="360" y="255" font-size="9" fill="#2563eb">GP7 SCL (I2C1)</text>
  <line x1="200" y1="280" x2="520" y2="180" stroke="#e65100" stroke-width="1"/>
  <text x="350" y="265" font-size="9" fill="#e65100">3V3 → VCC</text>
  <text x="530" y="228" font-size="9" fill="#666">GND → common rail below</text>
  
  <!-- Legend -->
  <rect x="350" y="320" width="310" height="110" fill="#fff" stroke="#ccc" rx="3"/>
  <text x="505" y="345" text-anchor="middle" font-weight="bold">Legend</text>
  <text x="365" y="365">Active-LOW: GPIO LOW = Light ON</text>
  <text x="365" y="382">3.3V from Pico for SSR control (active-low)</text>
  <text x="365" y="399">Wire multiple lights in parallel per color</text>
  <text x="365" y="416">Display shows: BLE steps, WiFi status, IP address</text>
  <text x="365" y="433">Display uses I2C1: GP6 (SDA), GP7 (SCL)</text>
</svg>
